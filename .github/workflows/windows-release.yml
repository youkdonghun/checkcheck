name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify update replacement and restart
        shell: powershell
        run: ./scripts/test-updater.ps1
      - name: Verify UI and tray
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .cache/qa -Force | Out-Null
          $exe = (Resolve-Path 'dist/CheckCheck.exe').Path
          $root = (Get-Location).Path
          foreach ($case in @(@('--smoke-test', "$root/.cache/qa/ui.png"), @('--lifecycle-self-test', "$root/.cache/qa/lifecycle.txt"))) {
            $run = Start-Process -FilePath $exe -ArgumentList @($case[0], ('"' + $case[1] + '"')) -WindowStyle Hidden -PassThru
            if (-not $run.WaitForExit(60000)) { $run.Kill(); throw 'UI check timed out' }
            if ($run.ExitCode -ne 0) { throw "UI check failed: $($case[0])" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CheckCheck-win-x64
          path: |
            dist/CheckCheck.exe
            dist/CheckCheck-win-x64.zip
            dist/SHA256SUMS.txt
            .cache/qa/*.png
            .cache/qa/*.result
            .cache/qa/*result.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_TAG --verify-tag --title "체크체크 $env:RELEASE_TAG" --generate-notes }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          gh release upload $env:RELEASE_TAG dist/CheckCheck.exe dist/CheckCheck-win-x64.zip dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
